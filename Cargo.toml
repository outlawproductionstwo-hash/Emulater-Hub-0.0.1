[package]
name = "emulator_hub_gui"
version = "0.0.1"
edition = "2024"
build = "build.rs"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }

[build-dependencies]
winres = "0.1"
